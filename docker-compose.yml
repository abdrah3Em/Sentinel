# One command for the judges:  docker compose up
#   grid simulation (the demo) ->  http://localhost:8080   Modbus TCP RTU on 5020
#   pipeline simulation        ->  http://localhost:8081   Modbus TCP RTU on 5021   (profile "pipeline")
# The operator token is printed by the dashboard container:
#   docker compose logs dashboard-grid | grep token
x-sentinel: &sentinel
  build: .
  environment:
    SENTINEL_MQTT_HOST: broker
    SENTINEL_PROCESS: grid
  volumes:
    - sentinel-data:/app/data          # token, signing master, guard SQLite — shared by every service
  depends_on:
    broker:
      condition: service_healthy
  restart: unless-stopped

services:
  broker:
    # eclipse-mosquitto:2, pinned by digest
    image: eclipse-mosquitto@sha256:38c0da4f2ef84284d47b3b3eeea1cb3bdeabe81ee10caf0cd5c5ff61ee3ea408
    command: mosquitto -c /mosquitto/config/mosquitto.conf
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
    ports: ["1883:1883"]
    healthcheck:
      test: ["CMD-SHELL", "mosquitto_sub -h 127.0.0.1 -t '$$SYS/broker/uptime' -C 1 -W 3 >/dev/null 2>&1 || exit 1"]
      interval: 5s
      timeout: 4s
      retries: 10
    restart: unless-stopped

  plant-grid:
    <<: *sentinel
    command: python -m sentinel.plant.run
    ports: ["5020:5020"]
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('127.0.0.1', 5020), timeout=2).close()"]
      interval: 10s
      timeout: 3s
      start_period: 15s
      retries: 5
  guard-grid:
    <<: *sentinel
    command: python -m sentinel.guard.run
    healthcheck:
      test: ["CMD", "python", "-c", "import os, time; p=os.environ.get('SENTINEL_GUARD_DB','/app/data/guard-grid.db'); assert os.path.exists(p) and time.time() - os.path.getmtime(p) < 60"]
      interval: 15s
      timeout: 3s
      start_period: 30s
      retries: 5
  dashboard-grid:
    <<: *sentinel
    command: python -m sentinel.api.app
    ports: ["8080:8080"]
    depends_on:
      broker:
        condition: service_healthy
      plant-grid:
        condition: service_healthy

  plant-pipeline:
    <<: *sentinel
    profiles: ["pipeline"]
    environment: { SENTINEL_MQTT_HOST: broker, SENTINEL_PROCESS: pipeline }
    command: python -m sentinel.plant.run
    ports: ["5021:5021"]
  guard-pipeline:
    <<: *sentinel
    profiles: ["pipeline"]
    environment: { SENTINEL_MQTT_HOST: broker, SENTINEL_PROCESS: pipeline }
    command: python -m sentinel.guard.run
  dashboard-pipeline:
    <<: *sentinel
    profiles: ["pipeline"]
    environment: { SENTINEL_MQTT_HOST: broker, SENTINEL_PROCESS: pipeline, SENTINEL_API_PORT: "8081" }
    command: python -m sentinel.api.app
    ports: ["8081:8081"]

volumes:
  sentinel-data:
